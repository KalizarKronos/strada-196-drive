}

const geometryData=JSON.parse(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
for(const [name,color,vertices,faces] of geometryData){
 let g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vertices.flatMap(([x,y,z])=>[x*.001,z*.001,-y*.001]),3));g.setIndex(faces.flat());g.computeVertexNormals();
 const mat=new T.MeshStandardMaterial({color,roughness:.5,metalness:name.startsWith('rim')?.45:.07,side:T.DoubleSide});
 if(name==='nose'||name==='tail'){mat.onBeforeCompile=shader=>{
 shader.vertexShader='varying vec3 panel;\n'+shader.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\npanel=position*1000.;');
 shader.fragmentShader='varying vec3 panel;\n'+shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
 float x=panel.x,y=abs(panel.z),z=panel.y;
 bool windshield=x>7.+y*.12 && x<53.-y*.10 && y<48.+(x-7.)*.18 && z>70.;
 bool sideglass=x> -56.+(91.-z)*.7 && x<39.-(z-70.)*.55 && y>40. && z>71.+.035*x && z<92.;
 bool backglass=x< -41. && x> -71. && y<43. && z>74.;
 if(windshield||sideglass||backglass)diffuseColor.rgb=vec3(.022,.064,.075)+vec3(.0007)*max(0.,z-70.);
 if(z<21. || (x< -122.&&z>71.))diffuseColor.rgb=vec3(.031,.036,.037);
 if(x>121. && x<140. && y>37. && y<62. && z>44.)diffuseColor.rgb=vec3(.91,.82,.58);
 if(x< -149. && y>30. && y<56. && z>34. && z<45.)diffuseColor.rgb=vec3(.50,.018,.006);
 if(y<4. && x>57. && z>42.)diffuseColor.rgb=vec3(.91,.82,.63);`)}}
 let m=new T.Mesh(g,mat);car.add(m);
 if(/^(rim|tyre)_/.test(name)){let front=name.includes('front'),side=name.endsWith('L')?1:-1;let pivot=new T.Group();pivot.position.set((front?1:-1)*.098,.031,-side*.085);car.add(pivot);pivot.add(m);m.position.copy(pivot.position).multiplyScalar(-1);wheels.push({pivot,front,side})}
 if(name==='nose'||name==='tail')body.push(m)
}
const state=fresh(),keys=new Set();let inspect=location.hash.includes('studio'),bare=location.hash.includes('bare'),spin=0,acc=0,last=0;
if(inspect)document.body.classList.add('studio');body.forEach(m=>m.visible=!bare);
const resetCar=()=>{Object.assign(state,fresh());spin=0};reset.onclick=resetCar;view.onclick=()=>{inspect=!inspect;view.textContent=inspect?'Drive':'View car'};
onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='r')resetCar()};
onkeyup=e=>keys.delete(e.key.toLowerCase());onblur=()=>keys.clear();document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};b.onlostpointercapture=()=>keys.delete(b.dataset.key)});
function frame(ms){
 let dt=Math.min(.06,(ms-last)/1000);last=ms;let pad=Array.from(navigator.getGamepads?.()||[]).find(Boolean);
 let gas=Number(keys.has('w')||keys.has('arrowup'))-Number(keys.has('s')||keys.has('arrowdown'))+(pad?(pad.buttons[7]?.value||0)-(pad.buttons[6]?.value||0):0);
 let turn=Number(keys.has('a')||keys.has('arrowleft'))-Number(keys.has('d')||keys.has('arrowright'))-(pad&&Math.abs(pad.axes[0])>.06?pad.axes[0]:0);
 if(!inspect){acc+=dt;while(acc>=.001){step(state,model,clamp(gas,-1,1),clamp(turn,-1,1));acc-=.001}spin+=state.spin*dt}
 car.position.set(state.x,0,-state.y);car.rotation.y=state.psi;
 for(const w of wheels){w.pivot.rotation.order='YXZ';w.pivot.rotation.y=w.front?state.angle[w.side===1?0:1]:0;w.pivot.rotation.z=-(w.front?state.travel/model.r:spin)}
 let dir=inspect?new T.Vector3(.33,.18,.34):new T.Vector3(-.78,.41,.19);dir.applyAxisAngle(new T.Vector3(0,1,0),state.psi);cam.position.copy(car.position).add(dir);let look=new T.Vector3(inspect?0:.24,.043,0).applyAxisAngle(new T.Vector3(0,1,0),state.psi).add(car.position);cam.lookAt(look);
 if(canvas.width!==Math.floor(innerWidth*renderer.getPixelRatio())||canvas.height!==Math.floor(innerHeight*renderer.getPixelRatio())){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
 speed.value=Math.round(Math.hypot(state.u,state.v)*3.6)+' km/h';renderer.render(scene,cam);requestAnimationFrame(frame)
}
window.driveState=state;requestAnimationFrame(frame);
</script></html>
